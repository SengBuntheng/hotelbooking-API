---
server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: hotel-booking-api
  profiles:
    active: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: "k2iV7N3pR9sX6vB0tJg8FzW5LmZ1xQe4UkAjNcEyGhTwRyPoDuCvBxMzLsKaQdEr"
    expiration-ms: 86400000
  otp:
    expiration:
      minutes: 5
    max:
      attempts: 3
    cleanup:
      interval:
        ms: 60000
    resend:
      timeout:
        minutes: 1

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    com.hotelbooking: DEBUG
    com.sun.mail: DEBUG
    jakarta.mail: DEBUG

