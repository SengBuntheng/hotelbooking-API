server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: hotel-booking-api
  profiles:
    active: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Common application properties
app:
  jwt:
    # Use an environment variable for the secret key. DO NOT hardcode this.
    secret: ${JWT_SECRET:MzQ1MzZmNDU0NjRmNjQ2ZDRlMzU0NzQ1NTUzNzcxNDU1NTQyNTQ0YzQxNTE0NDQ0NTM0NDU0NDU0MjQ1NDU1Mw==}
    expiration-ms: 86400000 # 24 hours
  otp:
    expiration:
      minutes: 5
    max:
      attempts: 3
    resend:
      timeout:
        minutes: 1

