server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    root: INFO
    AbaPaymentService: DEBUG
    com.example.hotelbooking: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: hotel-booking-api.log

  logback:
    rollingpolicy:
      file-name-pattern: hotel-booking-api.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

spring:
  application:
    name: hotel-booking-api
  profiles:
    active: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Common application properties
app:
  jwt:
    # Use an environment variable for the secret key. DO NOT hardcode this.
    secret: ${JWT_SECRET:MzQ1MzZmNDU0NjRmNjQ2ZDRlMzU0NzQ1NTUzNzcxNDU1NTQyNTQ0YzQxNTE0NDQ0NTM0NDU0NDU0MjQ1NDU1Mw==}
    # Access token expiration: 15 minutes for better security
    expiration-ms: 900000
    # Refresh token expiration: 7 days
    refresh-token-expiration-ms: 604800000
  otp:
    expiration:
      minutes: 5
    max:
      attempts: 3
    resend:
      timeout:
        minutes: 1

