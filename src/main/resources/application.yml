
server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: hotel-booking-api
  profiles:
    active: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    hibernate:
      ddl-auto: update
# --- Swagger / OpenAPI Configuration ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# ===================================================================
# DEVELOPMENT PROFILE (dev)
# Activated when running locally.
# ===================================================================
spring:
  config:
    activate:
      on-profile: "dev"
  datasource:
    url: jdbc:mysql://localhost:3306/hotelbooking_db_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_DEV_USERNAME:root}
    password: ${DB_DEV_PASSWORD:}

app:
  jwt:
    secret: "k2iV7N3pR9sX6vB0tJg8FzW5LmZ1xQe4UkAjNcEyGhTwRyPoDuCvBxMzLsKaQdEr"
    expiration-ms: 86400000

logging:
  level:

    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    com.hotelbooking: DEBUG

---
# ===================================================================
# PRODUCTION PROFILE (prod)
# Activated when deploying to a live server.
# ===================================================================
spring:
  config:
    activate:
      on-profile: "prod"
  datasource:

    url: ${DB_PROD_URL}
    username: ${DB_PROD_USERNAME}
    password: ${DB_PROD_PASSWORD}
  jpa:
    hibernate:
      # 'validate' is safer for production to prevent accidental data loss
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.hotelbooking: INFO