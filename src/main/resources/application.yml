server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: hotel-booking-api
  profiles:
    active: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # This is a more secure, longer key for HS512
    secret: 
    expiration-ms:  # 24 hours
  otp:
    expiration:
      minutes: 5
    max:
      attempts: 3
    cleanup:
      interval:
        ms: 60000
    resend:
      timeout:
        minutes: 1

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    com.hotelbooking: DEBUG
    com.sun.mail: DEBUG
    jakarta.mail: DEBUG

# Common ABA Configuration for all profiles
aba:
  public:
    key: 
  merchant: 
  # CORRECTED API Base URL. It should end with /payments/
  api: https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase
  # CORRECTED Callback URL. Removed extra "https://"
  callback: http://127.0.0.1:5501/v1/aba/callback

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/hotelbooking_db_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password:

  
---
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://mysql-1d18ad22-bunthengseng9-7dfc.f.aivencloud.com:17288/defaultdb?ssl-mode=REQUIRED
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl.trust: smtp.gmail.com

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  config: classpath:logback-spring-prod.xml
  level:
    root: WARN
    com.hotelbooking: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

telegram:
  alert:
    enabled: true
    bot-token: ${TELEGRAM_ALERT_BOT_TOKEN}
    chat-id: ${TELEGRAM_ALERT_CHAT_ID}
    rate-limit: 5
    include-stacktrace: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours

